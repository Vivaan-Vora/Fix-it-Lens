<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11141a">
<title>Fix-it Lens</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23121517'/%3E%3Cpath d='M40 15a13 13 0 0 0-16 16L10 45l9 9 14-14a13 13 0 0 0 16-16l-8 8-9-9z' fill='none' stroke='%23f06a35' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b0d12; --bg2:#11151b; --card:#171b22; --card2:#202630; --line:#333b49;
    --fg:#f5f2ea; --muted:#a7adb8; --accent:#ff6b35; --accent-hot:#ff9f43; --accent2:#28c7d9;
    --violet:#8b7cf6; --ok:#5bd6a2; --warn:#f4bd50; --bad:#f3756b; --radius:8px;
    --heat:linear-gradient(112deg,var(--accent) 0%,var(--accent-hot) 46%,#ffd166 100%);
    --spectrum:linear-gradient(112deg,var(--accent) 0%,var(--violet) 52%,var(--accent2) 100%);
    --surface:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,0) 44%),var(--card);
    --display:"Barlow Condensed", sans-serif; --body:"IBM Plex Sans", sans-serif; --mono:"IBM Plex Mono", monospace;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; min-height:100vh; color:var(--fg); font:16px/1.55 var(--body);
    background-color:var(--bg);
    background-image:radial-gradient(circle at 12% 4%,rgba(255,107,53,.18),transparent 28rem),radial-gradient(circle at 88% 18%,rgba(40,199,217,.13),transparent 31rem),radial-gradient(circle at 50% 82%,rgba(139,124,246,.09),transparent 34rem),linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:auto,auto,auto,32px 32px,32px 32px;
    background-attachment:fixed;
  }
  main { max-width:780px; margin:0 auto; padding:24px 16px 80px; }
  h1,h2,h3,.display { font-family:var(--display); letter-spacing:.005em; }
  h3 { margin:0 0 10px; font-size:20px; text-transform:uppercase; letter-spacing:.035em; }
  .muted { color:var(--muted); }
  .section-mark { display:inline-grid; place-items:center; min-width:27px; height:23px; margin-right:8px; padding:0 5px; border:1px solid rgba(255,107,53,.42); color:#ffad72; font:600 10px var(--mono); vertical-align:2px; background:linear-gradient(135deg,rgba(255,107,53,.13),rgba(139,124,246,.06)); }

  /* header */
  header { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; margin-bottom:44px; padding-top:12px; border-top:2px solid transparent; border-image:var(--spectrum) 1; }
  .brand { grid-column:2; display:flex; align-items:center; justify-content:center; gap:10px; font-family:var(--display); font-weight:700; font-size:24px; letter-spacing:.02em; text-transform:uppercase; }
  .logo { width:36px; height:36px; border-radius:5px; display:grid; place-items:center;
          background:linear-gradient(var(--card2),var(--card2)) padding-box,var(--spectrum) border-box; border:1px solid transparent; color:#ff9f68; box-shadow:0 0 24px rgba(255,107,53,.14); }
  .logo svg { width:19px; height:19px; }
  .badge { font:600 10px var(--mono); padding:7px 10px; border-radius:4px; border:1px solid var(--line);
           background:linear-gradient(110deg,rgba(255,107,53,.09),rgba(40,199,217,.07)),var(--card); color:var(--muted); white-space:nowrap; text-transform:uppercase; letter-spacing:.06em; justify-self:end; }
  .badge b { color:#ffad72; }

  .hero { position:relative; padding:0; text-align:center; }
  .hero::before { content:""; position:absolute; left:50%; bottom:10px; width:88px; height:2px; transform:translateX(-50%); background:var(--spectrum); box-shadow:0 0 22px rgba(255,107,53,.2); }
  .hero h1 { font-size:clamp(42px, 8vw, 62px); line-height:.95; margin:0 0 14px; text-transform:uppercase; letter-spacing:.01em; }
  .hero h1 span { color:var(--accent); background:var(--heat); background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .hero p { margin:0 auto 34px; color:var(--muted); font-size:17px; max-width:590px; }

  .card { background:var(--surface); border:1px solid var(--line); border-top-color:#465063;
          border-radius:var(--radius); padding:20px; margin-bottom:14px; box-shadow:0 14px 34px rgba(0,0,0,.24); }

  /* upload */
  .drop { position:relative; display:grid; place-items:center; text-align:center; min-height:220px;
          border:1px dashed #4a5668; border-radius:5px; cursor:pointer; overflow:hidden; transition:border-color .2s,background-color .2s,box-shadow .2s; background:radial-gradient(circle at 50% 38%,rgba(255,107,53,.08),transparent 45%),#10141a; }
  .drop:hover, .drop.drag { border-color:var(--accent); background:radial-gradient(circle at 50% 38%,rgba(255,107,53,.13),transparent 48%),#161923; box-shadow:inset 0 0 0 1px rgba(255,159,67,.08); }
  .drop .cta { padding:24px; }
  .drop .icon { width:48px; height:48px; margin:0 auto 12px; display:grid; place-items:center; border:1px solid rgba(255,107,53,.45); border-radius:50%; color:#ffd0a8; background:linear-gradient(145deg,rgba(255,107,53,.2),rgba(139,124,246,.12)); transition:transform .2s ease-out,border-color .2s; }
  .drop:hover .icon { transform:rotate(-6deg); border-color:var(--accent); }
  .drop .icon svg { width:22px; height:22px; }
  .drop strong { display:block; font-family:var(--display); font-size:22px; text-transform:uppercase; letter-spacing:.03em; }
  .drop .muted { font:12px var(--mono); }
  .drop img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
  .drop.has-img { display:flex; align-items:center; justify-content:center; border-style:solid; border-color:var(--line); min-height:0; padding:0; background:#10141a; }
  .drop.has-img img { position:relative; inset:auto; display:block; width:auto; max-width:100%; height:auto; max-height:min(520px,70vh); object-fit:contain; }
  .drop.has-img .cta { display:none; }
  .retake { position:absolute; right:10px; top:10px; z-index:3; display:none; min-height:42px; font:600 11px var(--mono);
            padding:7px 12px; border-radius:4px; border:1px solid rgba(255,255,255,.25); background:rgba(13,16,17,.82); color:#fff; cursor:pointer; backdrop-filter:blur(6px); text-transform:uppercase; }
  .drop.has-img .retake { display:block; }

  /* scanning */
  .scan { position:absolute; inset:0; display:none; z-index:2; pointer-events:none; }
  .scanning .scan { display:block; }
  .scan::before { content:""; position:absolute; inset:0; background:rgba(11,13,18,.35);
                  background-image:linear-gradient(rgba(255,176,32,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,176,32,.08) 1px, transparent 1px);
                  background-size:28px 28px; }
  .scan::after { content:""; position:absolute; left:0; right:0; height:90px; top:-90px;
                 background:linear-gradient(180deg, transparent, rgba(40,199,217,.34),rgba(255,107,53,.42), transparent);
                 border-bottom:2px solid var(--accent); animation:sweep 1.6s ease-in-out infinite; }
  @keyframes sweep { to { top:100%; } }

  textarea { width:100%; margin-top:14px; padding:13px 14px; min-height:54px; resize:vertical; font:16px var(--body);
             color:var(--fg); background:#101415; border:1px solid var(--line); border-radius:5px; outline:none; }
  textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,107,53,.14),0 0 28px rgba(139,124,246,.08); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chip { font:500 11px var(--mono); min-height:34px; padding:7px 10px; border-radius:4px; border:1px solid var(--line);
          background:var(--card2); color:var(--fg); cursor:pointer; transition:border-color .15s,color .15s,background-color .15s; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }

  .go { width:100%; min-height:52px; margin-top:16px; padding:14px; border:1px solid var(--accent); border-radius:5px; cursor:pointer;
        font:700 19px var(--display); text-transform:uppercase; letter-spacing:.06em; color:#fff;
        background:var(--heat); box-shadow:0 10px 28px rgba(255,107,53,.18); transition:filter .15s,border-color .15s,transform .15s,box-shadow .15s; }
  .go:hover { transform:translateY(-1px); filter:saturate(1.12) brightness(1.06); border-color:#ff9f43; box-shadow:0 14px 34px rgba(255,107,53,.26); }
  .go:disabled { opacity:.6; cursor:wait; transform:none; }
  .status { text-align:center; margin-top:12px; color:var(--muted); font:12px var(--mono); min-height:21px; }
  #err { display:none; margin-bottom:14px; padding:14px 16px; border-radius:5px; background:rgba(248,113,113,.1);
         border:1px solid rgba(248,113,113,.35); color:#fecaca; white-space:pre-wrap; }

  /* results */
  #out { scroll-margin-top:16px; }
  .reveal { animation:rise .45s ease both; }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } }
  .summary { display:flex; gap:16px; align-items:flex-start; }
  .summary img { width:92px; height:92px; object-fit:cover; border-radius:5px; flex-shrink:0; border:1px solid var(--line); }
  .summary h2 { margin:0 0 4px; font-size:32px; line-height:1; text-transform:uppercase; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
  .stat { background:linear-gradient(135deg,rgba(40,199,217,.055),rgba(139,124,246,.035)),#10141a; border:1px solid var(--line); border-radius:5px; padding:10px 12px; }
  .stat small { display:block; color:var(--muted); font:10px var(--mono); text-transform:uppercase; letter-spacing:.07em; }
  .stat b { font-size:16px; text-transform:capitalize; }
  .meter { height:6px; border-radius:99px; background:#262d3a; margin-top:7px; overflow:hidden; }
  .meter i { display:block; height:100%; border-radius:inherit; }

  .pills { display:flex; flex-wrap:wrap; gap:6px; }
  .pill { font:11px var(--mono); padding:4px 8px; border-radius:3px; background:var(--card2); border:1px solid var(--line); }

  .safety { display:flex; gap:14px; border-color:rgba(251,191,36,.45); background:linear-gradient(180deg,rgba(251,191,36,.10),rgba(251,191,36,.03)); }
  .safety.danger { border-color:rgba(248,113,113,.6); background:linear-gradient(180deg,rgba(248,113,113,.16),rgba(248,113,113,.04)); }
  .safety .sicon { width:30px; height:30px; flex:0 0 30px; display:grid; place-items:center; border:1px solid currentColor; border-radius:50%; font:600 15px var(--mono); }
  .safety h3 { color:var(--warn); text-transform:uppercase; letter-spacing:.04em; font-size:14px; }
  .safety.danger h3 { color:var(--bad); }
  .safety ul { margin:0; padding-left:18px; }

  .diag p { font-size:17px; margin:0 0 10px; }

  .verdict-head { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .decision { font:600 11px var(--mono); text-transform:uppercase; letter-spacing:.06em; padding:8px 11px; border-radius:4px; }
  .decision.repair { color:var(--ok); background:rgba(52,211,153,.12); border:1px solid rgba(52,211,153,.4); }
  .decision.replace { color:var(--bad); background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4); }
  .decision.pro { color:var(--warn); background:rgba(251,191,36,.12); border:1px solid rgba(251,191,36,.4); }
  .bars { margin:16px 0 8px; display:grid; gap:10px; }
  .bar { display:grid; grid-template-columns:72px 1fr 64px; align-items:center; gap:10px; font-size:14px; }
  .bar .track { height:12px; background:#101415; border:1px solid var(--line); border-radius:2px; overflow:hidden; }
  .bar .fill { height:100%; width:0; border-radius:99px; transition:width .9s cubic-bezier(.2,.8,.2,1); }
  .bar b { text-align:right; }
  .savings { display:inline-block; margin-top:6px; font-weight:700; color:var(--ok); }

  .progress { display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:14px; color:var(--muted); }
  .progress .meter { flex:1; margin:0; height:8px; }
  .progress .meter i { background:var(--spectrum); transition:width .3s; }
  .steps { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  .step { display:flex; gap:12px; align-items:flex-start; min-height:52px; padding:12px; border-radius:5px; background:#101415;
          border:1px solid var(--line); cursor:pointer; transition:border-color .15s,background-color .15s; user-select:none; }
  .step:hover { border-color:#58667e; background:linear-gradient(100deg,rgba(255,107,53,.055),rgba(40,199,217,.04)),#101415; }
  .step .num { flex-shrink:0; width:28px; height:28px; border-radius:3px; display:grid; place-items:center;
               font:600 11px var(--mono); background:var(--card2); border:1px solid var(--line); transition:.15s; }
  .step.done { opacity:.55; }
  .step.done .txt { text-decoration:line-through; }
  .step.done .num { background:var(--ok); border-color:var(--ok); color:#06261a; }
  .step.safety-step { border-color:rgba(251,191,36,.45); }

  .total { margin-top:12px; font-size:14px; color:var(--muted); }
  .total b { color:var(--fg); }

  .links { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .link { display:flex; align-items:center; gap:10px; min-height:62px; padding:12px; border-radius:5px; text-decoration:none; color:var(--fg);
          background:#101415; border:1px solid var(--line); transition:border-color .15s,transform .15s; }
  .link:hover { border-color:var(--accent); transform:translateY(-1px); background:linear-gradient(105deg,rgba(255,107,53,.08),rgba(139,124,246,.055)),#101415; }
  .link .li { width:30px; height:30px; display:grid; place-items:center; border:1px solid var(--line); border-radius:3px; color:var(--accent); font:600 9px var(--mono); }
  .link b { display:block; font-size:14px; }
  .link small { color:var(--muted); font-size:12px; }

  .shop { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  .shop li { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:5px; background:#101415; border:1px solid var(--line); flex-wrap:wrap; }
  .shop .what { flex:1; min-width:150px; }
  .shop .what b { display:block; font-size:15px; }
  .shop .what small { color:var(--muted); font-size:12px; }
  .tag { font:600 9px var(--mono); text-transform:uppercase; letter-spacing:.06em; padding:3px 6px; border-radius:3px; border:1px solid currentColor; }
  .tag.tool { color:#93c5fd; background:rgba(147,197,253,.12); }
  .tag.part { color:var(--accent); background:rgba(255,176,32,.12); }
  .price { font-weight:700; min-width:40px; text-align:right; }
  .buy { display:flex; gap:6px; }
  .buy a { font:500 10px var(--mono); padding:7px 9px; border-radius:3px; text-decoration:none; color:var(--fg);
           background:var(--card2); border:1px solid var(--line); white-space:nowrap; }
  .buy a:hover { border-color:var(--accent); color:var(--accent); }

  .again { width:100%; min-height:50px; padding:14px; border-radius:5px; border:1px solid var(--line); background:var(--card);
           color:var(--fg); font:700 17px var(--display); letter-spacing:.05em; text-transform:uppercase; cursor:pointer; }
  .again:hover { border-color:var(--accent); background:linear-gradient(105deg,rgba(255,107,53,.08),rgba(40,199,217,.05)),var(--card); }
  button:focus-visible,a:focus-visible,label:focus-within,textarea:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }

  @media (max-width:560px) {
    .stats { grid-template-columns:1fr 1fr; } .stats .stat:last-child { grid-column:span 2; }
    .links { grid-template-columns:1fr; }
    .buy { width:100%; } .buy a { flex:1; text-align:center; }
    .summary img { width:72px; height:72px; }
    .summary h2 { font-size:22px; }
    .badge .long { display:none; }
  }
  @media (prefers-reduced-motion:reduce) {
    html { scroll-behavior:auto; }
    *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.7 6.3a4 4 0 0 0-5-5l2.2 2.2-2.8 2.8-2.2-2.2a4 4 0 0 0 5 5l7.3 7.3a2 2 0 1 1-2.8 2.8l-7.3-7.3"/></svg></div>Fix-it Lens</div>
    <div class="badge"><span class="long">Powered by </span><b>Gemma 4</b></div>
  </header>

  <section class="hero" id="hero">
    <h1>Don't toss it. <span>Fix it.</span></h1>
    <p>Snap a photo of anything broken. Get the likely fault, a repair-or-replace verdict, and step-by-step instructions in seconds.</p>
  </section>

  <section class="card" id="input">
    <label class="drop" id="drop" for="file" tabindex="0">
      <img id="preview" alt="Selected item for diagnosis">
      <div class="scan"></div>
      <div class="cta">
        <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
        <strong>Take or upload a photo</strong>
        <span class="muted">Tap here, or drag an image in</span>
      </div>
      <button type="button" class="retake" id="retake">Change photo</button>
    </label>
    <input id="file" type="file" accept="image/*" capture="environment" hidden>

    <textarea id="desc" rows="1" aria-label="Describe the problem" placeholder="What's wrong? e.g. &quot;wobbles when I sit down&quot;"></textarea>
    <div class="chips">
      <button class="chip" type="button">Won't turn on</button>
      <button class="chip" type="button">Wobbly / loose</button>
      <button class="chip" type="button">Making a weird noise</button>
      <button class="chip" type="button">Cracked / snapped</button>
      <button class="chip" type="button">Leaking</button>
    </div>

    <button class="go" id="go">Diagnose it →</button>
    <div class="status" id="status" aria-live="polite"></div>
  </section>

  <div id="err" role="alert"></div>
  <div id="out"></div>

</main>

<script>
const $ = id => document.getElementById(id);
let file = null, previewUrl = null, statusTimer = null;

/* ---------- photo input ---------- */
function setFile(f) {
  if (!f || !f.type.startsWith("image/")) return;
  file = f;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(f);
  $("preview").src = previewUrl;
  $("drop").classList.add("has-img");
  hideError();
}
$("file").addEventListener("change", e => setFile(e.target.files[0]));
$("retake").addEventListener("click", e => { e.preventDefault(); $("file").value = ""; $("file").click(); });
$("drop").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); }
});

const drop = $("drop");
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("drag"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("drag"); }));
drop.addEventListener("drop", e => setFile(e.dataTransfer.files[0]));
document.addEventListener("paste", e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (item) setFile(item.getAsFile());
});

document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  const d = $("desc");
  d.value = d.value ? `${d.value.replace(/[.\s]+$/, "")}. ${c.textContent}` : c.textContent;
  d.focus();
}));

async function shrink(f, max = 1280) {
  try {
    const bmp = await createImageBitmap(f);
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    return blob || f;
  } catch { return f; }
}

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.]/g, "")); return isNaN(n) ? null : n; };
const money = v => { const n = num(v); return n === null ? "?" : "$" + Math.round(n).toLocaleString(); };
const cap = s => s ? String(s)[0].toUpperCase() + String(s).slice(1) : "";
const q = s => encodeURIComponent(String(s || "").trim());

const LINKS = {
  youtube: s => `https://www.youtube.com/results?search_query=${q(s)}`,
  ifixit: s => `https://www.ifixit.com/Search?query=${q(s)}`,
  google: s => `https://www.google.com/search?q=${q(s)}`,
  amazon: s => `https://www.amazon.com/s?k=${q(s)}`,
  homedepot: s => `https://www.homedepot.com/s/${q(s)}`,
};
const asItem = x => typeof x === "object" && x ? x : { name: x };

function showError(msg) { $("err").textContent = msg; $("err").style.display = "block"; }
function hideError() { $("err").style.display = "none"; }

const STATUS = [
  "Analyzing with Gemma…",
  "Identifying fractured parts…",
  "Assessing structural integrity…",
  "Pricing repair vs. replace…",
  "Writing your repair steps…"
];
function startStatus() {
  let i = 0; $("status").textContent = STATUS[0];
  statusTimer = setInterval(() => { i = Math.min(i + 1, STATUS.length - 1); $("status").textContent = STATUS[i]; }, 1800);
}
function stopStatus() { clearInterval(statusTimer); $("status").textContent = ""; }

/* ---------- render results ---------- */
function render(r) {
  const v = r.verdict || {}, s = r.safety || {}, d = r.diagnosis || {};
  const level = (s.level || "none").toLowerCase();
  const decision = (v.decision || "").toLowerCase();
  const cls = decision.startsWith("repair") ? "repair" : decision.startsWith("replace") ? "replace" : "pro";

  const conf = (d.confidence || "").toLowerCase();
  const confPct = { low: 33, medium: 66, high: 100 }[conf] ?? 50;
  const confColor = { low: "var(--bad)", medium: "var(--warn)", high: "var(--ok)" }[conf] ?? "var(--muted)";
  const diff = (r.difficulty || "").toLowerCase();
  const diffPct = { easy: 33, medium: 66, hard: 100 }[diff] ?? 50;
  const diffColor = { easy: "var(--ok)", medium: "var(--warn)", hard: "var(--bad)" }[diff] ?? "var(--muted)";

  const rc = num(v.repair_cost_usd), pc = num(v.replace_cost_usd);
  const maxC = Math.max(rc || 0, pc || 0, 1);
  const savings = rc !== null && pc !== null && pc > rc ? pc - rc : null;

  const shopItems = [
    ...(r.materials_needed || []).map(m => ({ ...asItem(m), kind: "part" })),
    ...(r.tools_needed || []).map(t => ({ ...asItem(t), kind: "tool" })),
  ].filter(i => i.name);
  const shopTotal = shopItems.reduce((t, i) => t + (num(i.approx_cost_usd) || 0), 0);
  const steps = r.steps || [];

  const res = r.resources || {};
  const fault = String(d.likely_fault || "").split(/[.:;,]/)[0];
  const videoQ = res.video_query || `how to fix ${r.item || ""} ${fault}`;
  const guideQ = res.guide_query || `${r.item || ""} repair`;

  $("out").innerHTML = `
    ${level !== "none" ? `
    <section class="card safety ${level === "danger" ? "danger" : ""} reveal">
      <div class="sicon" aria-hidden="true">!</div>
      <div><h3>${level === "danger" ? "Danger: read before touching" : "Use caution"}</h3>
        <ul>${(s.warnings || []).map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>
    </section>` : ""}

    <section class="card reveal">
      <div class="summary">
        <img src="${previewUrl}" alt="">
        <div>
          <div class="muted" style="font-size:13px;text-transform:uppercase;letter-spacing:.08em">We think this is</div>
          <h2>${esc(cap(r.item) || "Unknown item")}</h2>
          <div class="pills">${(r.parts || []).slice(0, 8).map(p => `<span class="pill">${esc(p)}</span>`).join("")}</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><small>Confidence</small><b>${esc(conf || "?")}</b><div class="meter"><i style="width:${confPct}%;background:${confColor}"></i></div></div>
        <div class="stat"><small>Difficulty</small><b>${esc(diff || "?")}</b><div class="meter"><i style="width:${diffPct}%;background:${diffColor}"></i></div></div>
        <div class="stat"><small>Time</small><b>${esc(r.time_estimate || "?")}</b></div>
      </div>
    </section>

    <section class="card diag reveal">
      <h3><span class="section-mark">01</span>Diagnosis</h3>
      <p>${esc(d.likely_fault)}</p>
      ${d.other_possibilities?.length ? `<div class="muted" style="font-size:14px;margin-bottom:6px">Could also be:</div>
        <div class="pills">${d.other_possibilities.map(o => `<span class="pill">${esc(o)}</span>`).join("")}</div>` : ""}
    </section>

    <section class="card reveal">
      <div class="verdict-head">
        <h3 style="margin:0"><span class="section-mark">02</span>Repair or replace?</h3>
        <span class="decision ${cls}">${esc(v.decision || "unsure")}</span>
      </div>
      <div class="bars">
        <div class="bar"><span>Repair</span><div class="track"><div class="fill" data-w="${(rc || 0) / maxC * 100}" style="background:var(--ok)"></div></div><b>${money(rc)}</b></div>
        <div class="bar"><span>Replace</span><div class="track"><div class="fill" data-w="${(pc || 0) / maxC * 100}" style="background:var(--bad)"></div></div><b>${money(pc)}</b></div>
      </div>
      ${savings ? `<span class="savings">Fixing it saves ~${money(savings)}</span>` : ""}
      <p class="muted" style="margin:8px 0 0">${esc(v.reasoning)}</p>
    </section>

    ${steps.length ? `
    <section class="card reveal">
      <h3><span class="section-mark">03</span>Step by step</h3>
      <div class="progress"><div class="meter"><i id="prog" style="width:0"></i></div><span id="progText">0 / ${steps.length}</span></div>
      <ol class="steps">
        ${steps.map((t, i) => `<li class="step ${i === 0 && level !== "none" ? "safety-step" : ""}"><span class="num">${i + 1}</span><span class="txt">${esc(String(t).replace(/^\s*\d+[.)]\s*/, ""))}</span></li>`).join("")}
      </ol>
      <div class="muted" style="font-size:13px;margin-top:10px">Tap a step to check it off.</div>
    </section>` : ""}

    ${shopItems.length ? `
    <section class="card reveal">
      <h3><span class="section-mark">04</span>What you'll need</h3>
      <ul class="shop">
        ${shopItems.map(i => {
          const term = i.search_term || i.name;
          return `<li>
            <span class="tag ${i.kind}">${i.kind}</span>
            <span class="what"><b>${esc(cap(i.name))}</b>${i.search_term && i.search_term !== i.name ? `<small>Search: “${esc(i.search_term)}”</small>` : ""}</span>
            <span class="price">${num(i.approx_cost_usd) ? money(i.approx_cost_usd) : ""}</span>
            <span class="buy">
              <a href="${LINKS.amazon(term)}" target="_blank" rel="noopener">Amazon</a>
              <a href="${LINKS.homedepot(term)}" target="_blank" rel="noopener">Home Depot</a>
            </span>
          </li>`;
        }).join("")}
      </ul>
      ${shopTotal ? `<div class="total">Est. total if you buy everything: <b>${money(shopTotal)}</b> <span>(you may already own the tools)</span></div>` : ""}
    </section>` : ""}

    <section class="card reveal">
      <h3><span class="section-mark">05</span>Learn how</h3>
      <div class="links">
        <a class="link" href="${LINKS.youtube(videoQ)}" target="_blank" rel="noopener"><span class="li">YT</span><span><b>Video tutorials</b><small>YouTube</small></span></a>
        <a class="link" href="${LINKS.ifixit(guideQ)}" target="_blank" rel="noopener"><span class="li">IF</span><span><b>Repair guides</b><small>iFixit</small></span></a>
        <a class="link" href="${LINKS.google(guideQ)}" target="_blank" rel="noopener"><span class="li">WEB</span><span><b>More help</b><small>Google</small></span></a>
      </div>
    </section>

    ${r.questions?.length ? `
    <section class="card reveal">
      <h3><span class="section-mark">06</span>To be more sure, tell us</h3>
      <ul>${r.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ul>
      <div class="muted" style="font-size:14px">Add the answer to the description above and diagnose again.</div>
    </section>` : ""}

    <button class="again reveal" id="again">Fix something else</button>
  `;

  // Stagger reveal animations + cost fill animation
  document.querySelectorAll("#out .reveal").forEach((el, i) => el.style.animationDelay = `${i * 70}ms`);
  requestAnimationFrame(() => setTimeout(() => document.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%"), 250));

  // Step checking interaction
  const stepEls = [...document.querySelectorAll(".step")];
  stepEls.forEach(el => el.addEventListener("click", () => {
    el.classList.toggle("done");
    const n = stepEls.filter(s => s.classList.contains("done")).length;
    $("prog").style.width = (n / stepEls.length * 100) + "%";
    $("progText").textContent = n === stepEls.length ? "Fixed" : `${n} / ${stepEls.length}`;
  }));

  // Reset button
  $("again").addEventListener("click", () => {
    $("out").innerHTML = ""; $("desc").value = ""; file = null; $("file").value = "";
    $("drop").classList.remove("has-img");
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  $("out").scrollIntoView({ behavior: "smooth" });
}

/* ---------- submit diagnosis ---------- */
$("go").addEventListener("click", async () => {
  hideError();
  if (!file) { showError("Add a photo first: tap the box above."); return; }
  $("go").disabled = true; $("go").textContent = "Inspecting…"; $("out").innerHTML = "";
  $("drop").classList.add("scanning"); startStatus();
  try {
    const fd = new FormData();
    fd.append("image", await shrink(file), "photo.jpg");
    fd.append("description", $("desc").value.trim());
    
    const res = await fetch("/api/diagnose", { method: "POST", body: fd });
    const rawText = await res.text();
    let json;
    try {
      json = JSON.parse(rawText);
    } catch {
      throw new Error(rawText || `Server returned ${res.status}`);
    }
    
    if (!res.ok || json.error) throw new Error(json.error || res.statusText);
    render(json);
  } catch (e) {
    showError("Couldn't diagnose that one. " + e.message);
  } finally {
    $("go").disabled = false; $("go").textContent = "Diagnose it →";
    $("drop").classList.remove("scanning"); stopStatus();
  }
});
</script>
</body>
</html>
