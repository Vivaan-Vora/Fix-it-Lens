<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Fix-it Lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b0d12; --bg2:#11141b; --card:#151922; --card2:#1b202b; --line:#262c39;
    --fg:#f2f4f8; --muted:#8d96a8; --accent:#ffb020; --accent2:#ff7a1a;
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --radius:18px;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; min-height:100vh; color:var(--fg); font:16px/1.5 Inter, system-ui, sans-serif;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(255,122,26,.18), transparent 60%),
      radial-gradient(700px 400px at -10% 10%, rgba(255,176,32,.10), transparent 60%),
      var(--bg);
  }
  main { max-width:760px; margin:0 auto; padding:20px 16px 80px; }
  h1,h2,h3,.display { font-family:"Space Grotesk", Inter, sans-serif; letter-spacing:-.02em; }
  h3 { margin:0 0 10px; font-size:17px; }
  .muted { color:var(--muted); }

  /* header */
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:28px; }
  .brand { display:flex; align-items:center; gap:10px; font-family:"Space Grotesk"; font-weight:700; font-size:20px; }
  .logo { width:36px; height:36px; border-radius:11px; display:grid; place-items:center;
          background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 6px 20px rgba(255,122,26,.35); }
  .badge { font-size:12px; font-weight:600; padding:6px 11px; border-radius:99px; border:1px solid var(--line);
           background:rgba(255,255,255,.03); color:var(--muted); white-space:nowrap; }
  .badge b { color:var(--accent); }

  .hero h1 { font-size:clamp(32px, 7vw, 48px); line-height:1.05; margin:0 0 10px; }
  .hero h1 span { background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p { margin:0 0 24px; color:var(--muted); font-size:17px; max-width:560px; }

  .card { background:linear-gradient(180deg,var(--card),var(--bg2)); border:1px solid var(--line);
          border-radius:var(--radius); padding:18px; margin-bottom:14px; }

  /* upload */
  .drop { position:relative; display:grid; place-items:center; text-align:center; min-height:220px;
          border:2px dashed #323a4a; border-radius:14px; cursor:pointer; overflow:hidden; transition:.2s; background:rgba(0,0,0,.18); }
  .drop:hover, .drop.drag { border-color:var(--accent); background:rgba(255,176,32,.05); }
  .drop .cta { padding:24px; }
  .drop .icon { font-size:40px; margin-bottom:6px; }
  .drop strong { display:block; font-size:18px; }
  .drop img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
  .drop.has-img { border-style:solid; border-color:var(--line); min-height:300px; }
  .drop.has-img img { display:block; }
  .drop.has-img .cta { display:none; }
  .retake { position:absolute; right:10px; top:10px; z-index:3; display:none; font-size:13px; font-weight:600;
            padding:7px 12px; border-radius:99px; border:0; background:rgba(0,0,0,.65); color:#fff; cursor:pointer; backdrop-filter:blur(6px); }
  .drop.has-img .retake { display:block; }

  /* scanning */
  .scan { position:absolute; inset:0; display:none; z-index:2; pointer-events:none; }
  .scanning .scan { display:block; }
  .scan::before { content:""; position:absolute; inset:0; background:rgba(11,13,18,.35);
                  background-image:linear-gradient(rgba(255,176,32,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,176,32,.08) 1px, transparent 1px);
                  background-size:28px 28px; }
  .scan::after { content:""; position:absolute; left:0; right:0; height:90px; top:-90px;
                 background:linear-gradient(180deg, transparent, rgba(255,176,32,.45), transparent);
                 border-bottom:2px solid var(--accent); animation:sweep 1.6s ease-in-out infinite; }
  @keyframes sweep { to { top:100%; } }

  textarea { width:100%; margin-top:14px; padding:13px 14px; min-height:54px; resize:vertical; font:inherit; font-size:16px;
             color:var(--fg); background:#0d1016; border:1px solid var(--line); border-radius:12px; outline:none; }
  textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,176,32,.15); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chip { font:inherit; font-size:13px; padding:7px 12px; border-radius:99px; border:1px solid var(--line);
          background:var(--card2); color:var(--fg); cursor:pointer; transition:.15s; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }

  .go { width:100%; margin-top:16px; padding:16px; border:0; border-radius:14px; cursor:pointer;
        font:700 18px "Space Grotesk", Inter, sans-serif; color:#16110a;
        background:linear-gradient(90deg,var(--accent),var(--accent2)); box-shadow:0 10px 30px rgba(255,122,26,.3); transition:.15s; }
  .go:hover { transform:translateY(-1px); box-shadow:0 14px 34px rgba(255,122,26,.4); }
  .go:disabled { opacity:.6; cursor:wait; transform:none; }
  .status { text-align:center; margin-top:12px; color:var(--muted); font-size:14px; min-height:21px; }
  #err { display:none; margin-bottom:14px; padding:14px 16px; border-radius:14px; background:rgba(248,113,113,.1);
         border:1px solid rgba(248,113,113,.35); color:#fecaca; white-space:pre-wrap; }

  /* results */
  #out { scroll-margin-top:16px; }
  .reveal { animation:rise .45s ease both; }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } }
  .summary { display:flex; gap:16px; align-items:flex-start; }
  .summary img { width:92px; height:92px; object-fit:cover; border-radius:14px; flex-shrink:0; border:1px solid var(--line); }
  .summary h2 { margin:0 0 4px; font-size:26px; line-height:1.15; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
  .stat { background:#0d1016; border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .stat small { display:block; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  .stat b { font-size:16px; text-transform:capitalize; }
  .meter { height:6px; border-radius:99px; background:#262c39; margin-top:7px; overflow:hidden; }
  .meter i { display:block; height:100%; border-radius:inherit; }

  .pills { display:flex; flex-wrap:wrap; gap:6px; }
  .pill { font-size:13px; padding:5px 11px; border-radius:99px; background:var(--card2); border:1px solid var(--line); }

  .safety { display:flex; gap:14px; border-color:rgba(251,191,36,.45); background:linear-gradient(180deg,rgba(251,191,36,.10),rgba(251,191,36,.03)); }
  .safety.danger { border-color:rgba(248,113,113,.6); background:linear-gradient(180deg,rgba(248,113,113,.16),rgba(248,113,113,.04)); animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 4px rgba(248,113,113,.12); } }
  .safety .sicon { font-size:28px; line-height:1; }
  .safety h3 { color:var(--warn); text-transform:uppercase; letter-spacing:.04em; font-size:14px; }
  .safety.danger h3 { color:var(--bad); }
  .safety ul { margin:0; padding-left:18px; }

  .diag p { font-size:17px; margin:0 0 10px; }

  .verdict-head { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .decision { font:700 15px "Space Grotesk"; text-transform:uppercase; letter-spacing:.06em; padding:8px 14px; border-radius:99px; }
  .decision.repair { color:var(--ok); background:rgba(52,211,153,.12); border:1px solid rgba(52,211,153,.4); }
  .decision.replace { color:var(--bad); background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4); }
  .decision.pro { color:var(--warn); background:rgba(251,191,36,.12); border:1px solid rgba(251,191,36,.4); }
  .bars { margin:16px 0 8px; display:grid; gap:10px; }
  .bar { display:grid; grid-template-columns:72px 1fr 64px; align-items:center; gap:10px; font-size:14px; }
  .bar .track { height:14px; background:#0d1016; border:1px solid var(--line); border-radius:99px; overflow:hidden; }
  .bar .fill { height:100%; width:0; border-radius:99px; transition:width .9s cubic-bezier(.2,.8,.2,1); }
  .bar b { text-align:right; }
  .savings { display:inline-block; margin-top:6px; font-weight:700; color:var(--ok); }

  .progress { display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:14px; color:var(--muted); }
  .progress .meter { flex:1; margin:0; height:8px; }
  .progress .meter i { background:linear-gradient(90deg,var(--accent),var(--ok)); transition:width .3s; }
  .steps { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  .step { display:flex; gap:12px; align-items:flex-start; padding:12px; border-radius:12px; background:#0d1016;
          border:1px solid var(--line); cursor:pointer; transition:.15s; user-select:none; }
  .step:hover { border-color:#3a4356; }
  .step .num { flex-shrink:0; width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
               font:700 13px "Space Grotesk"; background:var(--card2); border:1px solid var(--line); transition:.15s; }
  .step.done { opacity:.55; }
  .step.done .txt { text-decoration:line-through; }
  .step.done .num { background:var(--ok); border-color:var(--ok); color:#06261a; }
  .step.safety-step { border-color:rgba(251,191,36,.45); }

  .two { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .total { margin-top:10px; font-size:14px; color:var(--muted); }
  .total b { color:var(--fg); }

  .again { width:100%; padding:14px; border-radius:14px; border:1px solid var(--line); background:var(--card);
           color:var(--fg); font:600 16px Inter; cursor:pointer; }
  .again:hover { border-color:var(--accent); }
  footer { text-align:center; color:var(--muted); font-size:13px; margin-top:30px; }

  @media (max-width:560px) {
    .stats { grid-template-columns:1fr 1fr; } .stats .stat:last-child { grid-column:span 2; }
    .two { grid-template-columns:1fr; }
    .summary img { width:72px; height:72px; }
    .summary h2 { font-size:22px; }
    .badge .long { display:none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><div class="logo">🔧</div>Fix-it Lens</div>
    <div class="badge"><span class="long">Powered by </span><b>Gemma 4</b></div>
  </header>

  <section class="hero" id="hero">
    <h1>Don't toss it. <span>Fix it.</span></h1>
    <p>Snap a photo of anything broken. Get the likely fault, a repair-or-replace verdict, and step-by-step instructions in seconds.</p>
  </section>

  <section class="card" id="input">
    <label class="drop" id="drop" for="file">
      <img id="preview" alt="Your photo">
      <div class="scan"></div>
      <div class="cta">
        <div class="icon">📷</div>
        <strong>Take or upload a photo</strong>
        <span class="muted">Tap here, or drag an image in</span>
      </div>
      <button type="button" class="retake" id="retake">Change photo</button>
    </label>
    <input id="file" type="file" accept="image/*" capture="environment" hidden>

    <textarea id="desc" rows="1" placeholder="What's wrong? e.g. &quot;wobbles when I sit down&quot;"></textarea>
    <div class="chips">
      <button class="chip" type="button">Won't turn on</button>
      <button class="chip" type="button">Wobbly / loose</button>
      <button class="chip" type="button">Making a weird noise</button>
      <button class="chip" type="button">Cracked / snapped</button>
      <button class="chip" type="button">Leaking</button>
    </div>

    <button class="go" id="go">Diagnose it →</button>
    <div class="status" id="status"></div>
  </section>

  <div id="err"></div>
  <div id="out"></div>

  <footer>Fix-it Lens · Built at Hacktoberfest × CruzHacks with Gemma 4 · Estimates are rough. When in doubt, ask a pro.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
let file = null, previewUrl = null, statusTimer = null;

/* ---------- photo input ---------- */
function setFile(f) {
  if (!f || !f.type.startsWith("image/")) return;
  file = f;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(f);
  $("preview").src = previewUrl;
  $("drop").classList.add("has-img");
  hideError();
}
$("file").addEventListener("change", e => setFile(e.target.files[0]));
$("retake").addEventListener("click", e => { e.preventDefault(); $("file").value = ""; $("file").click(); });

const drop = $("drop");
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("drag"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("drag"); }));
drop.addEventListener("drop", e => setFile(e.dataTransfer.files[0]));
document.addEventListener("paste", e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (item) setFile(item.getAsFile());
});

document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  const d = $("desc");
  d.value = d.value ? `${d.value.replace(/[.\s]+$/, "")}. ${c.textContent}` : c.textContent;
  d.focus();
}));

// Phone photos are 4-12 MB; shrink before upload so the demo stays fast.
async function shrink(f, max = 1280) {
  try {
    const bmp = await createImageBitmap(f);
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    return blob || f;
  } catch { return f; }  // e.g. HEIC on desktop Chrome: send the original
}

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.]/g, "")); return isNaN(n) ? null : n; };
const money = v => { const n = num(v); return n === null ? "?" : "$" + Math.round(n).toLocaleString(); };
const cap = s => s ? String(s)[0].toUpperCase() + String(s).slice(1) : "";

function showError(msg) { $("err").textContent = msg; $("err").style.display = "block"; }
function hideError() { $("err").style.display = "none"; }

const STATUS = ["Looking at your photo…", "Identifying parts…", "Figuring out what broke…", "Pricing repair vs. replace…", "Writing your repair steps…"];
function startStatus() {
  let i = 0; $("status").textContent = STATUS[0];
  statusTimer = setInterval(() => { i = Math.min(i + 1, STATUS.length - 1); $("status").textContent = STATUS[i]; }, 1800);
}
function stopStatus() { clearInterval(statusTimer); $("status").textContent = ""; }

/* ---------- render ---------- */
function render(r) {
  const v = r.verdict || {}, s = r.safety || {}, d = r.diagnosis || {};
  const level = (s.level || "none").toLowerCase();
  const decision = (v.decision || "").toLowerCase();
  const cls = decision.startsWith("repair") ? "repair" : decision.startsWith("replace") ? "replace" : "pro";

  const conf = (d.confidence || "").toLowerCase();
  const confPct = { low: 33, medium: 66, high: 100 }[conf] ?? 50;
  const confColor = { low: "var(--bad)", medium: "var(--warn)", high: "var(--ok)" }[conf] ?? "var(--muted)";
  const diff = (r.difficulty || "").toLowerCase();
  const diffPct = { easy: 33, medium: 66, hard: 100 }[diff] ?? 50;
  const diffColor = { easy: "var(--ok)", medium: "var(--warn)", hard: "var(--bad)" }[diff] ?? "var(--muted)";

  const rc = num(v.repair_cost_usd), pc = num(v.replace_cost_usd);
  const maxC = Math.max(rc || 0, pc || 0, 1);
  const savings = rc !== null && pc !== null && pc > rc ? pc - rc : null;

  const mats = (r.materials_needed || []).map(m => typeof m === "object" ? m : { name: m });
  const matTotal = mats.reduce((t, m) => t + (num(m.approx_cost_usd) || 0), 0);

  const steps = r.steps || [];

  $("out").innerHTML = `
    ${level !== "none" ? `
    <section class="card safety ${level === "danger" ? "danger" : ""} reveal">
      <div class="sicon">${level === "danger" ? "⛔" : "⚠️"}</div>
      <div><h3>${level === "danger" ? "Danger: read before touching" : "Use caution"}</h3>
        <ul>${(s.warnings || []).map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>
    </section>` : ""}

    <section class="card reveal">
      <div class="summary">
        <img src="${previewUrl}" alt="">
        <div>
          <div class="muted" style="font-size:13px;text-transform:uppercase;letter-spacing:.08em">We think this is</div>
          <h2>${esc(cap(r.item) || "Unknown item")}</h2>
          <div class="pills">${(r.parts || []).slice(0, 8).map(p => `<span class="pill">${esc(p)}</span>`).join("")}</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><small>Confidence</small><b>${esc(conf || "?")}</b><div class="meter"><i style="width:${confPct}%;background:${confColor}"></i></div></div>
        <div class="stat"><small>Difficulty</small><b>${esc(diff || "?")}</b><div class="meter"><i style="width:${diffPct}%;background:${diffColor}"></i></div></div>
        <div class="stat"><small>Time</small><b>${esc(r.time_estimate || "?")}</b></div>
      </div>
    </section>

    <section class="card diag reveal">
      <h3>🔍 Diagnosis</h3>
      <p>${esc(d.likely_fault)}</p>
      ${d.other_possibilities?.length ? `<div class="muted" style="font-size:14px;margin-bottom:6px">Could also be:</div>
        <div class="pills">${d.other_possibilities.map(o => `<span class="pill">${esc(o)}</span>`).join("")}</div>` : ""}
    </section>

    <section class="card reveal">
      <div class="verdict-head">
        <h3 style="margin:0">💸 Repair or replace?</h3>
        <span class="decision ${cls}">${esc(v.decision || "unsure")}</span>
      </div>
      <div class="bars">
        <div class="bar"><span>Repair</span><div class="track"><div class="fill" data-w="${(rc || 0) / maxC * 100}" style="background:var(--ok)"></div></div><b>${money(rc)}</b></div>
        <div class="bar"><span>Replace</span><div class="track"><div class="fill" data-w="${(pc || 0) / maxC * 100}" style="background:var(--bad)"></div></div><b>${money(pc)}</b></div>
      </div>
      ${savings ? `<span class="savings">Fixing it saves ~${money(savings)}</span>` : ""}
      <p class="muted" style="margin:8px 0 0">${esc(v.reasoning)}</p>
    </section>

    ${steps.length ? `
    <section class="card reveal">
      <h3>🛠️ Step by step</h3>
      <div class="progress"><div class="meter"><i id="prog" style="width:0"></i></div><span id="progText">0 / ${steps.length}</span></div>
      <ol class="steps">
        ${steps.map((t, i) => `<li class="step ${i === 0 && level !== "none" ? "safety-step" : ""}"><span class="num">${i + 1}</span><span class="txt">${esc(String(t).replace(/^\s*\d+[.)]\s*/, ""))}</span></li>`).join("")}
      </ol>
      <div class="muted" style="font-size:13px;margin-top:10px">Tap a step to check it off.</div>
    </section>` : ""}

    ${(r.tools_needed?.length || mats.length) ? `
    <section class="two reveal">
      <div class="card" style="margin:0"><h3>🧰 Tools</h3><div class="pills">${(r.tools_needed || []).map(t => `<span class="pill">${esc(t)}</span>`).join("") || '<span class="muted">None needed</span>'}</div></div>
      <div class="card" style="margin:0"><h3>🔩 Parts & materials</h3><div class="pills">${mats.map(m => `<span class="pill">${esc(m.name)}${num(m.approx_cost_usd) ? ` · ${money(m.approx_cost_usd)}` : ""}</span>`).join("") || '<span class="muted">None needed</span>'}</div>
        ${matTotal ? `<div class="total">Est. parts total: <b>${money(matTotal)}</b></div>` : ""}</div>
    </section>
    <div style="height:14px"></div>` : ""}

    ${r.questions?.length ? `
    <section class="card reveal">
      <h3>🤔 To be more sure, tell us</h3>
      <ul>${r.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ul>
      <div class="muted" style="font-size:14px">Add the answer to the description above and diagnose again.</div>
    </section>` : ""}

    <button class="again reveal" id="again">📷 Fix something else</button>
  `;

  // stagger card entrance + animate cost bars
  document.querySelectorAll("#out .reveal").forEach((el, i) => el.style.animationDelay = `${i * 70}ms`);
  requestAnimationFrame(() => setTimeout(() => document.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%"), 250));

  const stepEls = [...document.querySelectorAll(".step")];
  stepEls.forEach(el => el.addEventListener("click", () => {
    el.classList.toggle("done");
    const n = stepEls.filter(s => s.classList.contains("done")).length;
    $("prog").style.width = (n / stepEls.length * 100) + "%";
    $("progText").textContent = n === stepEls.length ? "Fixed! 🎉" : `${n} / ${stepEls.length}`;
  }));

  $("again").addEventListener("click", () => {
    $("out").innerHTML = ""; $("desc").value = ""; file = null; $("file").value = "";
    $("drop").classList.remove("has-img");
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  $("out").scrollIntoView({ behavior: "smooth" });
}

/* ---------- submit ---------- */
$("go").addEventListener("click", async () => {
  hideError();
  if (!file) { showError("Add a photo first: tap the box above."); return; }
  $("go").disabled = true; $("go").textContent = "Inspecting…"; $("out").innerHTML = "";
  $("drop").classList.add("scanning"); startStatus();
  try {
    const fd = new FormData();
    fd.append("image", await shrink(file), "photo.jpg");
    fd.append("description", $("desc").value.trim());
    const res = await fetch("/api/diagnose", { method: "POST", body: fd });
    const json = await res.json().catch(() => ({ error: `Server returned ${res.status}` }));
    if (!res.ok || json.error) throw new Error(json.error || res.statusText);
    render(json);
  } catch (e) {
    showError("Couldn't diagnose that one. " + e.message);
  } finally {
    $("go").disabled = false; $("go").textContent = "Diagnose it →";
    $("drop").classList.remove("scanning"); stopStatus();
  }
});
</script>
</body>
</html>
